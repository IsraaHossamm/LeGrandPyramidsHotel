<div
  class="block max-w-sm p-6 rounded-2xl border transition-all duration-300 mb-2 bg-white hover:border-[#B08D4F] cursor-pointer"
  [class.border-[#B08D4F]]="isActive"
  [class.shadow-xl]="isActive"
  [class.border-gray-200]="!isActive"
  (click)="onViewDetails()"
>
  <h2 class="text-xl font-bold uppercase tracking-tight mb-2">{{ room.title }}</h2>
  <div class="w-20 h-[3px] bg-[#B08D4F] mb-6"></div>
  <ul class="space-y-1 mb-5">
    @for (highlight of room.highlights; track $index) {
      <li class="flex items-center gap-2 font-semibold uppercase text-[.75rem] tracking-wide">
        <span class="w-1.5 h-1.5 bg-black rounded-full"></span> {{ highlight }}
      </li>
    }
  </ul>

  <div class="flex justify-between mb-5">
    <div class="flex flex-col items-center gap-2 w-1/3">
      <div class="h-8 flex items-center justify-center">
        <i class="fa-solid fa-bed text-2xl"></i>
      </div>
      <span class="text-[10px] font-bold uppercase text-center leading-tight">{{
        room.bedType
      }}</span>
    </div>

    <div class="flex flex-col items-center gap-2 w-1/3">
      <div class="h-8 flex items-center justify-center">
        <i class="fa-solid fa-wifi text-2xl"></i>
      </div>
      <span class="text-[10px] font-bold uppercase text-center leading-tight">Wifi</span>
    </div>

    <div class="flex flex-col items-center gap-2 w-1/3">
      <div class="h-8 flex items-center justify-center">
        <img src="/air-conditioner.svg" alt="A/c" class="h-6 w-auto object-contain" />
      </div>
      <span class="text-[10px] font-bold uppercase text-center leading-tight">AC</span>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <button
      (click)="onViewDetails()"
      class="py-3 px-4 border-2 cursor-pointer border-[#B08D4F] text-[#B08D4F] rounded-xl font-bold uppercase text-[.7rem] hover:bg-[#B08D4F] hover:text-white transition-colors"
    >
      View Details
    </button>
    <button
      (click)="openWhatsapp(room.title)"
      class="py-3 px-4 bg-[#9A7B43] cursor-pointer text-white rounded-xl font-bold uppercase text-xs hover:bg-[#866a3a] transition-colors"
    >
      Book Now
    </button>
  </div>
</div>
