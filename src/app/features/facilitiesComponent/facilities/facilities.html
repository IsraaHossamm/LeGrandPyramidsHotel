<section class="bg-[#fcf9f5] py-8 px-4 min-h-screen flex items-center" id="facalities">
  <div class="max-w-6xl mx-auto w-full">
    <!-- Header -->
    <header class="mb-8 text-center">
      <h2 class="text-3xl font-serif text-gray-800 mb-2 font-semibold">Premium Facilities</h2>
      <div class="w-40 h-[3px] bg-[#B08D4F] mb-6 mx-auto"></div>
      <p class="text-gray-600 text-sm max-w-xxl mx-auto">
        From stunning views to personalized services, we offer everything you need to relax,
        recharge, and create lasting memories.
      </p>
    </header>

    <!-- Optimized Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (item of facilites; track item.title) {
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-full">
          <!-- Image Section -->
          <div class="relative h-40 flex-shrink-0">
            <img
              [src]="item.img"
              [alt]="item.title"
              class="w-full h-full object-cover rounded-t-xl"
            />

            <!-- Icon Badge -->
            <div
              class="absolute -bottom-5 left-1/2 -translate-x-1/2 w-10 h-10 bg-[#a68a56] border-4 border-white rounded-full flex items-center justify-center text-white shadow-sm"
            >
              <span class="material-icons text-lg"><i [class]="item.icon"></i></span>
            </div>
          </div>

          <!-- Content Section (Auto-height) -->
          <div class="pt-8 pb-4 px-4 text-center flex-grow flex flex-col justify-start">
            <h3 class="text-lg font-serif font-bold text-gray-800 mb-2 leading-tight">
              {{ item.title }}
            </h3>
            <!-- <p class="text-gray-500 text-xs leading-normal">
              {{ item.description }}
            </p> -->
          </div>
        </div>
      }
    </div>
  </div>
</section>
