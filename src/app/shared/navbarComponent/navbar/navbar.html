<nav class="bg-[#f7f5ec] fixed w-full z-20 top-0 start-0 border-b border-default">

        <!-- HOME LINK -->
        <li>
          <a
            (click)="scrollToSection('home')"
            [class]="
              activeFragment === 'home'
                ? 'block py-2 px-3 cursor-pointer text-white bg-[#5A4026] rounded md:bg-transparent md:text-[#5A4026] md:p-0 font-bold'
                : 'block py-2 px-3 cursor-pointer text-heading rounded hover:bg-[#5A4026] hover:text-white md:hover:bg-transparent md:border-0 md:hover:text-[#5A4026] md:p-0'

          </a>

        <!-- ROOMS LINK -->
        <li>
          <a
            (click)="scrollToSection('rooms')"
            [class]="

                ? 'block py-2 px-3 cursor-pointer text-white bg-[#5A4026] rounded md:bg-transparent md:text-[#5A4026] md:p-0 font-bold'

            Rooms

        <!-- FACILITIES LINK -->
        <li>
          <a
            (click)="scrollToSection('facalities')"

            Facilities
          </a>

        <li>
          <a
            (click)="scrollToSection('reviews')"
            [class]="

                ? 'block py-2 px-3 cursor-pointer text-white bg-[#5A4026] rounded md:bg-transparent md:text-[#5A4026] md:p-0 font-bold'

        <li>
